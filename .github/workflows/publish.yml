name: Publish to npm

# Release: `npm version patch|minor|major` then `git push --follow-tags`
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use an npm version that supports trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Check tag matches package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $expected"
            exit 1
          fi

      - name: Smoke test the CLI
        run: |
          node bin/cli.js --version
          project="$(mktemp -d)"
          node bin/cli.js init "$project"
          for f in AGENTS.md CLAUDE.md .claude/harness/WORKFLOW.md .claude/agents/engineer.md .claude/skills/owasp-checklist/SKILL.md; do
            test -f "$project/$f" || { echo "::error::Missing $f after init"; exit 1; }
          done
          test -d "$project/tasks/todo" || { echo "::error::Missing tasks/todo after init"; exit 1; }
          # A second run must not duplicate anything, and --force must keep local.md
          echo "- custom" >> "$project/.claude/harness/local.md"
          node bin/cli.js init "$project" --force > /dev/null
          [ "$(grep -c '^@AGENTS.md' "$project/CLAUDE.md")" -eq 1 ] || { echo "::error::Second init duplicated CLAUDE.md imports"; exit 1; }
          grep -q -- "- custom" "$project/.claude/harness/local.md" || { echo "::error::init --force overwrote local.md"; exit 1; }
          # The board script runs on an empty board
          node bin/cli.js status "$project"

      - name: Smoke test the Cursor and Codex adapters
        run: |
          project="$(mktemp -d)"
          node bin/cli.js init "$project" --agent=cursor,codex
          # Fails if a Claude-only phrase in .claude/commands no longer matches the adapter rewrites
          for f in .agents/skills/next/SKILL.md .agents/skills/status/SKILL.md .cursor/agents/engineer.md .codex/agents/engineer.toml .codex/agents/reviewer.toml; do
            test -f "$project/$f" || { echo "::error::Missing $f after init --agent"; exit 1; }
          done
          grep -q "^developer_instructions = " "$project/.codex/agents/engineer.toml" || { echo "::error::Codex agent has no developer_instructions"; exit 1; }
          if grep -rqE 'SendMessage|model: haiku|\$ARGUMENTS' "$project/.agents/skills"; then
            echo "::error::Claude-only wording left in generated skills"; exit 1
          fi
          if node bin/cli.js init "$project" --agent=nope 2> /dev/null; then
            echo "::error::init accepted an unknown --agent value"; exit 1
          fi

      - name: Show package contents
        run: npm pack --dry-run

      - name: Publish
        run: npm publish --access public
